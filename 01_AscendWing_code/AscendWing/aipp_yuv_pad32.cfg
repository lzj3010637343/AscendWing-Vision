# AIPP 配置：DVPP YUV 输入 -> 硬件预处理（色彩转换 / padding / 归一化）
#
# ATC 编译命令：
#   atc --model=<onnx> --framework=5 --output=<om> \
#       --input_format=NCHW --input_shape="images:1,3,640,640" \
#       --soc_version=Ascend310B1 --output_type=FP16 \
#       --insert_op_conf=aipp_yuv_pad32.cfg

aipp_op {
    aipp_mode: static
    input_format: YUV420SP_U8
    csc_switch: true
    rbuv_swap_switch: false

    var_reci_chn_0: 0.00392157
    var_reci_chn_1: 0.00392157
    var_reci_chn_2: 0.00392157

    src_image_size_w: 640
    src_image_size_h: 576

    padding: true
    top_padding_size: 32
    bottom_padding_size: 32
    left_padding_size: 0
    right_padding_size: 0
}
