# AIPP 配置：纯 RGB 归一化（CPU 喂图用，无 CSC / 无 padding）
# 适用模型：yolov5s_ball_640 / yolo26s_visdrone_p2p4_640
#
# ATC 编译命令：
#   atc --model=<onnx> --framework=5 --output=<om> \
#       --input_format=NCHW --input_shape="images:1,3,640,640" \
#       --soc_version=Ascend310B1 --output_type=FP16 \
#       --insert_op_conf=aipp_rgb_norm.cfg

aipp_op {
    aipp_mode: static
    input_format: RGB888_U8
    csc_switch: false

    # 归一化：× 1/255
    var_reci_chn_0: 0.00392157
    var_reci_chn_1: 0.00392157
    var_reci_chn_2: 0.00392157

    src_image_size_w: 640
    src_image_size_h: 640

    padding: false
}
